<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startside</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6f4f;
    --note: #fff3a6;
    --note-edge: #f2df6b;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 48px; }

  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 28px; }
  #clock { font-size: 44px; font-weight: 300; letter-spacing: -1px; }
  #date { color: var(--muted); font-size: 17px; text-transform: capitalize; }

  h2 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }

  /* Lenker */
  .links {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
    margin-bottom: 36px;
  }
  .link {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    aspect-ratio: 1 / 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text); text-decoration: none;
    font-weight: 500; text-align: center; padding: 12px;
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .link:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.07); border-color: #d1d5db; }
  .link img, .link .letter { width: 64px; height: 64px; border-radius: 14px; }
  .link .letter {
    display: grid; place-items: center;
    background: var(--accent); color: #fff; font-size: 30px; font-weight: 600;
  }

  /* Vær + lapper */
  .bottom { display: grid; grid-template-columns: 380px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 860px) { .bottom { grid-template-columns: 1fr; } }

  .weather {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden;
  }
  .weather iframe { display: block; width: 100%; height: 360px; border: 0; }
  .weather a { display: block; padding: 10px 14px; font-size: 14px; color: var(--accent); text-decoration: none; border-top: 1px solid var(--line); }

  .notes-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .notes-head h2 { margin: 0; }
  #addNote {
    border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    padding: 8px 16px; border-radius: 10px; cursor: pointer;
  }
  #addNote:hover { filter: brightness(1.1); }
  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .note {
    position: relative;
    background: var(--note);
    border-bottom: 3px solid var(--note-edge);
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    min-height: 180px;
  }
  .note textarea {
    width: 100%; height: 100%; min-height: 180px;
    border: 0; background: transparent; resize: vertical;
    padding: 16px 16px 16px; font: 16px/1.45 "Segoe UI", system-ui, sans-serif; color: #3a3320;
    outline: none;
  }
  .note .del {
    position: absolute; top: 4px; right: 6px;
    border: 0; background: transparent; cursor: pointer;
    font-size: 20px; line-height: 1; color: #8a7a2e; opacity: 0; transition: opacity .15s;
    padding: 4px 6px;
  }
  .note:hover .del, .note:focus-within .del { opacity: 1; }
  .empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </header>

  <section>
    <h2>Lenker</h2>
    <nav class="links" id="links"></nav>
  </section>

  <div class="bottom">
    <section>
      <h2>Været i Slemmestad</h2>
      <div class="weather">
        <!-- Byttes ut med koden fra yr.no/nb/widget hvis du vil ha en annen modul -->
        <iframe src="https://www.yr.no/nb/innhold/1-73371/card.html" title="Værvarsel for Slemmestad fra Yr" loading="lazy"></iframe>
        <a href="https://www.yr.no/nb/v%C3%A6rvarsel/daglig-tabell/1-73371/Norge/Akershus/Asker/Slemmestad" target="_blank" rel="noopener">Åpne full varsel på Yr →</a>
      </div>
    </section>

    <section>
      <div class="notes-head">
        <h2>Lapper</h2>
        <button id="addNote">+ Ny lapp</button>
      </div>
      <div class="notes" id="notes"></div>
    </section>
  </div>

</div>

<script>
// ---- LENKER: rediger her for å legge til, fjerne eller endre rekkefølge ----
const LINKS = [
  { name: "Claude",          url: "https://claude.ai" },
  { name: "Wayfinder",       url: "https://friluft.avadaptive.no/wayfinder/" },
  { name: "Explorer",        url: "https://friluft.avadaptive.no/explorer" },
  { name: "Naturbase",       url: "https://kart.naturbase.no" },
  { name: "Søknadssenteret", url: "https://soknadssenter.miljodirektoratet.no" },
  { name: "NRK",             url: "https://www.nrk.no" },
  { name: "Gmail",           url: "https://mail.google.com" },
];

const linksEl = document.getElementById("links");
LINKS.forEach(l => {
  const a = document.createElement("a");
  a.className = "link";
  a.href = l.url;
  const host = new URL(l.url).hostname;
  const img = document.createElement("img");
  img.alt = "";
  img.src = `https://www.google.com/s2/favicons?domain=${host}&sz=128`;
  img.onerror = () => {
    const d = document.createElement("div");
    d.className = "letter";
    d.textContent = l.name[0];
    img.replaceWith(d);
  };
  const span = document.createElement("span");
  span.textContent = l.name;
  a.append(img, span);
  linksEl.append(a);
});

// ---- KLOKKE ----
function tick() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("date").textContent =
    now.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
}
tick();
setInterval(tick, 10000);

// ---- GULE LAPPER (lagres i nettleseren) ----
const KEY = "startside-lapper";
const notesEl = document.getElementById("notes");

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save(notes) {
  try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch {}
}

let notes = load();

function render() {
  notesEl.innerHTML = "";
  if (!notes.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Ingen lapper ennå.";
    notesEl.append(p);
    return;
  }
  notes.forEach((n, i) => {
    const div = document.createElement("div");
    div.className = "note";
    const ta = document.createElement("textarea");
    ta.value = n.text;
    ta.placeholder = "Skriv noe…";
    ta.addEventListener("input", () => { notes[i].text = ta.value; save(notes); });
    const del = document.createElement("button");
    del.className = "del";
    del.title = "Slett lapp";
    del.textContent = "×";
    del.addEventListener("click", () => {
      if (ta.value.trim() && !confirm("Slette denne lappen?")) return;
      notes.splice(i, 1); save(notes); render();
    });
    div.append(ta, del);
    notesEl.append(div);
  });
}

document.getElementById("addNote").addEventListener("click", () => {
  notes.unshift({ text: "" });
  save(notes);
  render();
  notesEl.querySelector("textarea")?.focus();
});

render();
</script>
</body>
</html>
